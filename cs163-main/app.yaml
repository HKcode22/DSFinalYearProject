runtime: python312 # Or python311, python310 depending on your needs

instance_class: F4_1G # Adjust instance class based on expected load/memory

entrypoint: gunicorn -b :$PORT --workers 4 --threads 4 appengine.app163:server # Run Gunicorn, point to server object in app163.py inside appengine dir

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0 # Can scale down to 0 to save costs when idle
  max_instances: 2 # Adjust max instances based on expected traffic
  min_pending_latency: 30ms # Optional: Configure latency targets
  max_pending_latency: automatic
  max_concurrent_requests: 50 # Adjust based on app behavior

env_variables:
  BUCKET_NAME: 'staging.oval-sunset-450610-h4.appspot.com'

handlers:
# This configures static file serving for anything in the 'assets' folder.
- url: /assets
  static_dir: appengine/assets

# All other routes are handled by the Flask application.
- url: /.*
  script: auto 